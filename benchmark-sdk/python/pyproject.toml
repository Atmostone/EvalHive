[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalhive-benchmark"
version = "0.1.0"
description = "Benchmark and environment provider contracts for EvalHive"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["jsonschema==4.25.1", "referencing==0.37.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalhive_benchmark = ["schemas/*.json"]
