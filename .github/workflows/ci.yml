name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  harness-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK dependencies
        run: |
          python -m pip install -e sdk/python pytest ruff build
          python -m pip install -e runner
          npm ci --prefix sdk/typescript
          npm run build --prefix sdk/typescript
          npm ci --prefix sdk/examples/fake
      - name: SDK lint and cross-language process conformance
        run: |
          ruff check sdk/python sdk/fixtures/peer.py sdk/examples/fake/connector.py
          python -m pytest -c sdk/python/pyproject.toml sdk/python/tests
          python -m pytest -c runner/pyproject.toml runner/tests
          python -m pytest -c /dev/null scripts/tests
          EH_TEST_PYTHON="$(command -v python)" npm test --prefix sdk/typescript
      - name: Build distributable SDK packages
        run: |
          mkdir -p /tmp/evalhive-sdk-packages
          python -m build sdk/python --outdir /tmp/evalhive-sdk-packages
          cd sdk/typescript
          npm pack --pack-destination /tmp/evalhive-sdk-packages

  benchmark-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: benchmark-sdk/typescript/package-lock.json
      - name: Install benchmark SDK dependencies
        run: |
          python -m pip install -e benchmark-sdk/python pytest==8.4.2 ruff==0.14.3 build==1.3.0
          python -m pip install -e benchmarks/evalhive-cases
          python -m pip install -e benchmarks/toolathlon-gym
          npm ci --prefix benchmark-sdk/typescript
          npm run build --prefix benchmark-sdk/typescript
          npm ci --prefix benchmark-sdk/examples/fake
      - name: Benchmark SDK conformance and source lock
        run: |
          ruff check benchmark-sdk/python benchmark-sdk/examples/fake/connector.py benchmark-sdk/scripts
          python benchmark-sdk/scripts/verify-sources.py
          python -m pytest -c /dev/null benchmark-sdk/python/tests
          EH_TEST_PYTHON="$(command -v python)" npm test --prefix benchmark-sdk/typescript
      - name: Native case compatibility and SDK worker
        env:
          CASE_CORPUS_PATH: ${{ github.workspace }}/backend/benchmarks
        run: |
          ruff check benchmarks/evalhive-cases benchmarks/toolathlon-gym
          python -m pytest -c /dev/null --confcutdir=benchmarks benchmarks/evalhive-cases/tests benchmarks/toolathlon-gym/tests
          python -m build benchmarks/evalhive-cases --outdir /tmp/evalhive-benchmark-packages
          python -m build benchmarks/toolathlon-gym --outdir /tmp/evalhive-benchmark-packages
      - name: Build benchmark SDK distributions
        run: |
          mkdir -p /tmp/evalhive-benchmark-packages
          python -m build benchmark-sdk/python --outdir /tmp/evalhive-benchmark-packages
          npm pack ./benchmark-sdk/typescript --pack-destination /tmp/evalhive-benchmark-packages

  benchmark-adapters:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        connector: [harbor, tau2, mcpmark, appworld, swebench]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            benchmark-sdk/python/pyproject.toml
            benchmarks/${{ matrix.connector }}/pyproject.toml
      - name: Install isolated adapter test tools
        run: python -m pip install pytest==9.2.0 pytest-asyncio==1.4.1.post1 ruff==0.14.3 build==1.3.0 setuptools==80.9.0 wheel==0.48.0
      - name: Install the native Harbor parser and verifier subset
        if: matrix.connector == 'harbor'
        run: python -m pip install --no-deps --require-hashes -r benchmarks/harbor/requirements.lock
      - name: Install SDK and adapter packages without EvalHive backend
        run: |
          python -m pip install --no-build-isolation -e benchmark-sdk/python httpx==0.28.1 docker==7.1.0 PyYAML==6.0.3
          python -m pip install --no-build-isolation --no-deps -e benchmarks/${{ matrix.connector }}
      - name: Check adapter contracts and build the distribution
        env:
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          LLM_MODEL: ""
        run: |
          ruff check benchmarks/${{ matrix.connector }}
          python -m build --no-isolation benchmarks/${{ matrix.connector }} --outdir /tmp/evalhive-adapter-packages
          python -m pip install --no-deps --force-reinstall /tmp/evalhive-adapter-packages/*.whl
      - name: Verify the installed wheel without the backend
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import importlib.util; assert importlib.util.find_spec("app") is None'
          python -m pytest -c /dev/null --asyncio-mode=auto --confcutdir="${{ github.workspace }}/benchmarks" "${{ github.workspace }}/benchmarks/${{ matrix.connector }}/tests"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evalhive_test
          POSTGRES_USER: evalhive
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U evalhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://evalhive:password@localhost:5432/evalhive_test
      JWT_SECRET: ci-test-secret-please-rotate
      MINIO_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: evalhive-ci
      MINIO_SECRET_KEY: fixture-only-storage-password
      QDRANT_URL: http://localhost:19033
      REDIS_URL: redis://localhost:19079/0

    steps:
      - uses: actions/checkout@v4

      - name: Start the runner user bus for rootless cgroups
        run: |
          ci_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${ci_uid}.service"
          ci_bus="unix:path=/run/user/${ci_uid}/bus"
          XDG_RUNTIME_DIR="/run/user/${ci_uid}" DBUS_SESSION_BUS_ADDRESS="$ci_bus" systemctl --user start dbus
          echo "DBUS_SESSION_BUS_ADDRESS=$ci_bus" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
      - name: Start isolated integration services and cache the pinned tokenizer
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/evalhive-tokenizers
        run: |
          docker build -f tests/e2e/Minio.Dockerfile -t evalhive-test-minio:ci tests/e2e
          docker run -d --name evalhive-ci-minio -p 127.0.0.1:19000:9000 --memory 512m --cpus 1 --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges -e MINIO_ROOT_USER=evalhive-ci -e MINIO_ROOT_PASSWORD=fixture-only-storage-password evalhive-test-minio:ci server /data
          docker run -d --name evalhive-ci-qdrant -p 127.0.0.1:19033:6333 --memory 512m --cpus 1 --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
          docker run -d --user redis --name evalhive-ci-redis -p 127.0.0.1:19079:6379 --memory 128m --cpus 1 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges redis@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
          mkdir -p "$TIKTOKEN_CACHE_DIR"
          curl --fail --location --retry 2 --max-time 60 https://openaipublic.blob.core.windows.net/encodings/cl100k_base.tiktoken -o "$TIKTOKEN_CACHE_DIR/9b5ad71b2ce5302211f9c61530b329a4922fc6a4"
          echo "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7 $TIKTOKEN_CACHE_DIR/9b5ad71b2ce5302211f9c61530b329a4922fc6a4" | sha256sum --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -e sdk/python
          pip install -e benchmark-sdk/python
          pip install -e runner
          pip install ruff

      - name: Lint (ruff)
        run: ruff check backend/app

      - name: Run pytest
        working-directory: backend
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/evalhive-tokenizers
          DATA_DIR: ${{ runner.temp }}/evalhive-backend-data
          PYTHONPATH: ${{ github.workspace }}/backend
        # --cov-fail-under enforces the 60% coverage acceptance bar (legacy production-readiness §R4).
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

  native-harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the runner user bus for rootless cgroups
        run: |
          ci_uid="$(id -u)"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@${ci_uid}.service"
          ci_bus="unix:path=/run/user/${ci_uid}/bus"
          XDG_RUNTIME_DIR="/run/user/${ci_uid}" DBUS_SESSION_BUS_ADDRESS="$ci_bus" systemctl --user start dbus
          echo "DBUS_SESSION_BUS_ADDRESS=$ci_bus" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Build the pinned frontend production image
        run: docker build --target prod -t evalhive-frontend:ci frontend
      - name: Pinned native conformance and Work browser acceptance
        env:
          E2E_DATA_DIR: ${{ runner.temp }}/evalhive-e2e-data
          E2E_RESULTS_DIR: ${{ runner.temp }}/evalhive-e2e-results
        run: bash tests/e2e/run-rootless.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-acceptance
          path: ${{ runner.temp }}/evalhive-e2e-results
