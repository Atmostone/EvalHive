name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  harness-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK dependencies
        run: |
          python -m pip install -e sdk/python pytest ruff build
          python -m pip install -e runner
          npm ci --prefix sdk/typescript
          npm run build --prefix sdk/typescript
          npm ci --prefix sdk/examples/fake
      - name: SDK lint and cross-language process conformance
        run: |
          ruff check sdk/python sdk/fixtures/peer.py sdk/examples/fake/connector.py
          python -m pytest -c sdk/python/pyproject.toml sdk/python/tests
          python -m pytest -c runner/pyproject.toml runner/tests
          EH_TEST_PYTHON="$(command -v python)" npm test --prefix sdk/typescript
      - name: Build distributable SDK packages
        run: |
          mkdir -p /tmp/evalhive-sdk-packages
          python -m build sdk/python --outdir /tmp/evalhive-sdk-packages
          cd sdk/typescript
          npm pack --pack-destination /tmp/evalhive-sdk-packages

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evalhive_test
          POSTGRES_USER: evalhive
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U evalhive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://evalhive:password@localhost:5432/evalhive_test
      JWT_SECRET: ci-test-secret-please-rotate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -e sdk/python
          pip install -e runner
          pip install ruff

      - name: Lint (ruff)
        run: ruff check backend/app

      - name: Run pytest
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        # --cov-fail-under enforces the 60% coverage acceptance bar (legacy production-readiness §R4).
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60

  native-harness-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-docker-action@v5
        with:
          rootless: true
          set-host: true
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - name: Pinned native conformance and Work browser acceptance
        env:
          E2E_DATA_DIR: ${{ runner.temp }}/evalhive-e2e-data
          E2E_RESULTS_DIR: ${{ runner.temp }}/evalhive-e2e-results
        run: bash tests/e2e/run-rootless.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-acceptance
          path: ${{ runner.temp }}/evalhive-e2e-results
