[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalhive-appworld"
version = "0.1.0"
description = "Pinned native AppWorld MCP integration for EvalHive"
requires-python = ">=3.12"
dependencies = ["evalhive-benchmark==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalhive_appworld = ["*.json"]
