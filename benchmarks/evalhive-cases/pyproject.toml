[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalhive-cases"
version = "0.1.0"
description = "Native EvalHive YAML and JSON case adapter for the Benchmark SDK"
requires-python = ">=3.12"
dependencies = ["evalhive-benchmark==0.1.0", "jsonschema==4.25.1", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalhive_cases = ["schemas/*.json"]
